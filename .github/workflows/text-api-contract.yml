name: Text API contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public library and focused test runner
        run: python -m pip install -e . pytest
      - name: Check read-only text API contract
        run: python -m pytest tests/test_hms_text.py -q
      - name: Check DSS read and write contracts without Java
        run: python -m pytest tests/test_dss_java_fixes.py -m "not requires_java" -q
      - name: Check HEC-HMS run verification and version selection without HEC-HMS
        run: python -m pytest tests/test_compute_run_verification.py -m "not requires_hms and not local_hms and not slow" --basetemp "${{ runner.temp }}/compute-run-verification" -q
