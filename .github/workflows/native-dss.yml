name: Native DSS engine

# Offline runs of the test suite on the optional native DSS engine
# (ras-commander-fast-dss from PyPI), and a shadow run that compares it with
# HEC Monolith (Java). No HEC-HMS, no private files and no network while tests
# run: HMS_COMMANDER_TEST_OFFLINE=1 makes tests/conftest.py refuse every network
# connection, so tests that need HEC-HMS, downloads or Monolith skip through
# their own guards. scripts/ci/check_dss_ci_run.py then fails a run in which the
# engine (or Java) tests were skipped instead of run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dss-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  PYTHONFAULTHANDLER: '1'
  HMS_COMMANDER_TEST_OFFLINE: '1'
  # After the session, dump every thread's stack every 120 s until the process
  # exits, so an exit hang leaves evidence in the log (tests/conftest.py).
  HMS_COMMANDER_TEST_EXIT_WATCH: '120'

jobs:
  native:
    name: native engine (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HMS_COMMANDER_DSS_BACKEND: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install hms-commander with the dss, gis and aorc extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dss,gis,aorc]" pytest
          python -c "import importlib.metadata as m; print('ras-commander-fast-dss', m.version('ras-commander-fast-dss'))"
      - name: Test suite on the native backend (offline)
        timeout-minutes: 20
        shell: bash
        run: >-
          python -m pytest tests -p no:cacheprovider -q -rs
          -o addopts="--strict-markers --tb=short"
          --junitxml=junit-native.xml
      - name: Fail a vacuous run (engine tests must have run)
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          python scripts/ci/check_dss_ci_run.py junit-native.xml --backend native
          --min-total 900
          --min test_dss_engine_wrappers=54
          --min test_dss_native_write_ownership=11
          --min test_aorc_shg_route=20
          --min test_hms_grid_lattice=9
          --min test_dss_extra_marker=8
          --min test_dss_native_backend=80
      - name: Keep the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-native-${{ matrix.os }}
          path: junit-native.xml
          if-no-files-found: warn

  shadow:
    name: shadow, native vs HEC Monolith (${{ matrix.os }}, Python 3.12, Java 17)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HMS_COMMANDER_DSS_BACKEND: shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install hms-commander with the dss, gis and aorc extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dss,gis,aorc]" pytest
          python -c "import importlib.metadata as m; print('ras-commander-fast-dss', m.version('ras-commander-fast-dss'))"
      # HEC Monolith 3.3.27 and javaHeclib 7-IU-8, from the public HEC Nexus and
      # Maven Central sources hms-commander already uses, cached between runs. The
      # download happens here, before the tests, never during them.
      - name: Cache HEC Monolith
        uses: actions/cache@v4
        with:
          path: ~/.hms-commander/dss
          key: hec-monolith-3.3.27-javaHeclib-7-IU-8-${{ runner.os }}-v1
      - name: Provision HEC Monolith (outside test time)
        shell: bash
        env:
          HMS_COMMANDER_TEST_OFFLINE: '0'
        run: >-
          python -c "from hms_commander.dss.core import DssCore;
          m = DssCore._ensure_monolith();
          print('HEC Monolith installed:', m.is_installed())"
      - name: Test suite on the shadow backend (offline)
        timeout-minutes: 30
        shell: bash
        run: >-
          python -m pytest tests -p no:cacheprovider -q -rs
          -o addopts="--strict-markers --tb=short"
          --junitxml=junit-shadow.xml
      - name: Fail a vacuous run (Java and engine tests must have run)
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          python scripts/ci/check_dss_ci_run.py junit-shadow.xml --backend shadow
          --min-total 900
          --min test_dss_engine_wrappers=54
          --min test_dss_native_write_ownership=11
          --min test_dss_java_fixes=30
          --min test_dss_native_backend=110
          --min test_aorc_period_stamps=31
          --min test_dss_file_release=6
      - name: Keep the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-shadow-${{ matrix.os }}
          path: junit-shadow.xml
          if-no-files-found: warn
