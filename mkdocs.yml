site_name: HMS Commander Documentation
site_description: Python library for automating HEC-HMS operations
site_url: https://gpt-cmdr.github.io/hms-commander/
repo_url: https://github.com/gpt-cmdr/hms-commander
repo_name: gpt-cmdr/hms-commander
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/hms-commander_logo.svg
  favicon: assets/favicon.ico

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      allow_errors: false
      ignore:
        - "examples/*/hms413_*/**"
        - "examples/*/multi_version_test/**"
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gpt-cmdr/hms-commander
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hms-commander/
    - icon: fontawesome/solid/building
      link: https://clbengineering.com/
      name: CLB Engineering Corporation
    - icon: fontawesome/solid/lightbulb
      link: https://clbengineering.com/llm-forward
      name: LLM Forward Engineering
  generator: false
  version:
    provider: mike

